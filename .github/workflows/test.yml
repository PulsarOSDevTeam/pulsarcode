name: tests

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  picker-tests:
    name: picker test suite (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Bash syntax check (launcher + installer)
        shell: bash
        run: |
          bash -n pulsarcode
          bash -n install.sh

      - name: Python AST check (proxy modules)
        shell: bash
        run: |
          python -c "
          import ast
          for f in ['proxy/__init__.py', 'proxy/nim_api_sonar.py', 'proxy/nim_anthropic_proxy.py', 'proxy/nim_sonar_picker.py']:
              ast.parse(open(f).read())
              print(f, 'OK')
          "

      - name: Picker unit tests
        shell: bash
        env:
          PYTHONPATH: .
          PULSAR_NIM_SONAR_NETWORK: '0'
        run: pytest tests/test_sonar_picker.py -v --tb=short

      - name: Em-dash leak audit
        shell: bash
        run: |
          if grep -rln $'\xe2\x80\x94' --include='*.md' --include='*.sh' --include='*.py' --include='pulsarcode' .; then
            echo "::error::em dash characters found in source files"
            exit 1
          fi
          echo "em-dash sweep clean"
