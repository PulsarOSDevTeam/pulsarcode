#
# Tests, audits and install smoke tests on every push to main and every pull request (pull
# requests skip the x86_64 macOS row, see the matrix). Third-party actions are pinned by full
# commit SHA (Dependabot keeps them current).

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PULSAR_FX: 'off'

jobs:
  audit:
    name: audits (lint, syntax, em dash, secrets, packaging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install tools
        run: python -m pip install pyflakes pytest pyyaml pillow

      - name: pyflakes
        run: python -m pyflakes pulsar tests tools

      - name: Shell syntax
        run: |
          bash -n pulsarcode
          bash -n install.sh
          bash -n tools/github/setup.sh
          node --check packaging/npm/bin/pulsarcode.js

      - name: Em-dash audit (every tracked text file)
        run: python tools/release/em_dash_audit.py

      - name: Secret-pattern audit (every tracked file, tests included)
        run: python tools/release/secret_scan.py

      - name: Packaging metadata (pyproject, npm, Homebrew, Scoop, workflows)
        run: python -m pytest -q tests/test_packaging.py

      # The PNG checks (no mascot in the posters and stills) and the posterize test need Pillow, which the
      # test rows below do not install: here they run instead of skipping.
      - name: Brand assets (replays, posters and stills, with Pillow)
        run: python -m pytest -q tests/test_demo_brand.py tests/test_brand_assets.py

      - name: Ruby syntax of the Homebrew formula
        run: ruby -c packaging/homebrew/pulsarcode.rb

      - name: Release build dry run (hash-pinned backend, the publish action's twine)
        run: |
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install --require-hashes --no-deps \
            -r tools/release/requirements-build.txt
          "$RUNNER_TEMP/build/bin/python" -m build --no-isolation --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/twine"
          "$RUNNER_TEMP/twine/bin/python" -m pip install --require-hashes --no-deps \
            -r tools/release/requirements-check.txt
          "$RUNNER_TEMP/twine/bin/python" -m twine check --strict "$RUNNER_TEMP"/dist/*
          python tools/release/update_manifests.py --check-tag "v$(python -c 'import pulsar; print(pulsar.__version__)')"

  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Windows support is experimental: its failures are reported but do not fail the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      # While the repository is private, macOS minutes bill at ten times the Linux rate: pull requests
      # run one macOS row (arm64), and pushes to main and manual runs add x86_64 macOS (macos-13 was
      # retired in December 2025; macos-15-intel replaces it). Every Python version pyproject.toml
      # claims has a pull-request row.
      matrix:
        include: ${{ fromJSON(format('[{0}{1}]',
          '{"os":"ubuntu-latest","python":"3.9","experimental":false},
           {"os":"ubuntu-latest","python":"3.10","experimental":false},
           {"os":"ubuntu-latest","python":"3.11","experimental":false},
           {"os":"ubuntu-latest","python":"3.13","experimental":false},
           {"os":"ubuntu-24.04-arm","python":"3.12","experimental":false},
           {"os":"macos-latest","python":"3.12","experimental":false},
           {"os":"windows-latest","python":"3.12","experimental":true}',
          github.event_name != 'pull_request' && ',{"os":"macos-15-intel","python":"3.12","experimental":false}' || '')) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest build

      - name: Unit, adapter and Core tests
        env:
          PULSAR_OFFLINE: '1'
        run: python -m pytest -q

      - name: Shell syntax
        if: runner.os != 'Windows'
        run: |
          bash -n pulsarcode
          bash -n install.sh

      - name: Installer smoke (install.sh from this checkout)
        if: runner.os != 'Windows'
        env:
          PULSAR_NO_LAUNCH: '1'
          PULSAR_SKIP_CLAUDE: '1'
          PULSAR_NO_PATH: '1'
          PULSAR_HOME: ${{ runner.temp }}/pulsarhome
          PULSAR_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          bash install.sh --local   # without --local the installer downloads main from GitHub
          "$PULSAR_BIN_DIR/pulsarcode" version
          "$PULSAR_BIN_DIR/pulsarcode" providers
          PULSAR_OFFLINE=1 "$PULSAR_BIN_DIR/pulsarcode" status
          # Nothing from the working directory may run (fake pulsar/, json.py, ... in the cwd).
          python tools/release/smoke.py --status "$PULSAR_BIN_DIR/pulsarcode"

      - name: Installer smoke (install.ps1 from this checkout)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PULSAR_NO_LAUNCH: '1'
          PULSAR_SKIP_CLAUDE: '1'
          PULSAR_NO_PATH: '1'
          PULSAR_HOME: ${{ runner.temp }}\pulsarhome
          PULSAR_BIN_DIR: ${{ runner.temp }}\bin
        run: |
          ./install.ps1 -Local   # without -Local the installer downloads main from GitHub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $cmd = Join-Path $env:PULSAR_BIN_DIR 'pulsarcode.cmd'
          if (-not (Test-Path $cmd)) { $cmd = Join-Path $HOME '.local\bin\pulsarcode.cmd' }
          foreach ($sub in @('version', 'providers')) {
            & $cmd $sub
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $env:PULSAR_OFFLINE = '1'
          & $cmd status
          python tools/release/smoke.py --status $cmd
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Wheel build + install smoke (fresh venv, hostile working directory)
        env:
          PULSAR_HOME: ${{ runner.temp }}/wheelhome
        run: python tools/release/wheel_smoke.py

      - name: npm wrapper tests
        run: |
          node --version
          node --test packaging/npm/test/pulsarcode.test.js

      - name: npm wrapper against the installed app
        if: runner.os != 'Windows'
        env:
          PULSAR_HOME: ${{ runner.temp }}/pulsarhome
        run: python tools/release/smoke.py node "$GITHUB_WORKSPACE/packaging/npm/bin/pulsarcode.js"

      - name: npx pulsarcode (packed tarball) from a hostile folder with node_modules/.bin
        if: runner.os != 'Windows'
        env:
          PULSAR_HOME: ${{ runner.temp }}/pulsarhome
          npm_config_update_notifier: 'false'
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/npmpack"
          npm pack ./packaging/npm --pack-destination "$RUNNER_TEMP/npmpack"
          tgz="$(ls "$RUNNER_TEMP"/npmpack/pulsarcode-*.tgz)"
          python tools/release/smoke.py npx --yes --package "$tgz" pulsarcode
